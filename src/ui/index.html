<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1e1e1e" />
  <link rel="icon" href="data:," />
  <title>Город для всех</title>

  <!-- Стили лежат в src/ui/styles и подключаются из app.ts (Vite соберёт их в бандл).
       Leaflet и его картинки импортируются в map-screen.ts — как и раньше,
       чтобы APK не зависел от внешних CDN. -->
</head>
<body>
  <!-- =========================================================================
       Сцена. На десктопе приложение показывается в «телефоне» по центру тёмного
       фона (как в макете), на реальном телефоне — во весь экран.
       ========================================================================= -->
  <div class="stage">
    <div class="device" id="device">
      <div class="screens" id="screens">

        <!-- ===================================================================
             ЭКРАНЫ 1–3. Рейтинг: таблица / пьедестал / список участников.
             Три вида живут в одном экране и переключаются каруселью.
             =================================================================== -->
        <section class="screen screen--rating" data-screen="rating" aria-label="Рейтинг участников">
          <header class="rating-head">
            <h1 class="rating-title" id="rating-title-root">
              <span class="rating-title__star" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                     stroke-linejoin="round" stroke-linecap="round">
                  <path d="M12 3.4l2.56 5.46 5.98.8-4.38 4.16 1.1 5.94L12 16.94l-5.26 2.82 1.1-5.94L3.46 9.66l5.98-.8L12 3.4z" />
                </svg>
              </span>
              <span class="rating-title__text" id="rating-title">Таблица рейтинга</span>
            </h1>
          </header>

          <div class="rating-viewport" id="rating-viewport">
            <div class="rating-track" id="rating-track">
              <article class="rating-view" data-view="table" aria-label="Таблица рейтинга"></article>
              <article class="rating-view" data-view="podium" aria-label="Пьедестал"></article>
              <article class="rating-view" data-view="list" aria-label="Рейтинг участников"></article>
            </div>
          </div>

          <div class="rating-dots" id="rating-dots" role="tablist" aria-label="Вид рейтинга">
            <button class="rating-dot" type="button" role="tab" data-view="table"
                    aria-label="Таблица рейтинга" aria-selected="true"></button>
            <button class="rating-dot" type="button" role="tab" data-view="podium"
                    aria-label="Пьедестал" aria-selected="false"></button>
            <button class="rating-dot" type="button" role="tab" data-view="list"
                    aria-label="Рейтинг участников" aria-selected="false"></button>
          </div>

          <nav class="bottom-nav" aria-label="Быстрые действия">
            <button class="nav-btn" type="button" data-action="back" aria-label="Назад к карте">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M19.5 12H5" />
                <path d="M11 5.5L4.5 12l6.5 6.5" />
              </svg>
            </button>
            <button class="nav-btn" type="button" data-action="add" aria-label="Добавить объект на карте">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 20.2l.95-4.1L15.9 5.15a2.2 2.2 0 0 1 3.1 3.1L8.15 19.25 4 20.2z" />
                <path d="M14.6 6.5l3 3" />
              </svg>
            </button>
            <button class="nav-btn" type="button" data-action="profile" id="nav-profile" aria-label="Профиль и выход">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                   stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8.2" r="3.6" />
                <path d="M5 20.2c0-3.5 3.1-6.1 7-6.1s7 2.6 7 6.1" />
              </svg>
            </button>
          </nav>
        </section>

        <!-- ===================================================================
             ЭКРАН КАРТЫ. Старый рабочий экран сбора данных: точка → форма.
             Свёрстан отдельным экраном, чтобы рейтинг и карта не мешали друг
             другу. Карта создаётся лениво (при первом показе экрана).
             =================================================================== -->
        <section class="screen screen--map" data-screen="map" aria-label="Карта">
          <div id="map"></div>

          <button class="map-rating-btn" type="button" id="map-rating-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                 stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
              <path d="M12 3.4l2.56 5.46 5.98.8-4.38 4.16 1.1 5.94L12 16.94l-5.26 2.82 1.1-5.94L3.46 9.66l5.98-.8L12 3.4z" />
            </svg>
            <span>Рейтинг</span>
          </button>

          <!-- Панель формы ввода (поверх карты, скрыта до нажатия «Добавить») -->
          <div id="form-panel" class="form-panel">
            <div class="panel-header">
              <span>Вы хотите внести информацию о:</span>
              <span id="panel-close" class="close">✕</span>
            </div>
            <div id="panel-coords" class="panel-coords"></div>

            <!-- Сюда каркас отрисует три секции-аккордеона -->
            <div id="form-container"></div>

            <div class="panel-footer">
              <button id="save-btn" class="save-btn">Сохранить</button>
              <div class="hint">Данные попадают в общую базу проекта</div>
            </div>

            <pre id="debug" class="debug"></pre>
          </div>
        </section>

        <!-- ===================================================================
             ЭКРАН 4. Подтверждение выхода. Появляется круговой «шторкой»
             из кнопки профиля, поэтому у него своя анимация, а не слайд.
             =================================================================== -->
        <section class="screen screen--logout" data-screen="logout" role="dialog"
                 aria-modal="true" aria-labelledby="logout-title" aria-hidden="true"
                 tabindex="-1">
          <div class="logout-body">
            <div class="logout-icon" aria-hidden="true">
              <span class="logout-icon__halo"></span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.2 4.4v15.2" />
                <path d="M20.2 4.4h-3.6" />
                <path d="M20.2 19.6h-3.6" />
                <path d="M14.2 12H3.8" />
                <path d="M7.4 8.3L3.8 12l3.6 3.7" />
              </svg>
            </div>
            <h2 class="logout-title" id="logout-title">Выйти из аккаунта?</h2>
            <p class="logout-sub">Вы уверены, что хотите выйти?</p>
          </div>

          <div class="logout-actions">
            <button class="btn btn--primary" type="button" id="logout-confirm">Выйти</button>
            <button class="btn btn--ghost" type="button" id="logout-cancel">Отмена</button>
          </div>
        </section>

      </div>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </div>

  <script type="module" src="./app.ts"></script>
</body>
</html>
