<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Город для всех</title>

  <!-- Стили Leaflet (обязательны для корректного отображения карты) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }

    /* Карта на весь экран. Обязателен ненулевой размер! */
    #map { position: absolute; inset: 0; z-index: 1; }

    /* Нижняя карточка карты (координаты + "Добавить") */
    .map-card {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 16px;
      z-index: 1000;
      width: calc(100% - 24px);
      max-width: 340px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 10px rgba(0,0,0,.2);
      padding: 12px 14px;
    }
    .map-card-address { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
    .map-card-coords  { font-size: 12px; color: #777; margin-bottom: 10px; }
    .map-card-add {
      width: 100%; height: 40px; background: #f0a500; color: #fff;
      border: none; border-radius: 6px; font-size: 15px; font-weight: 500; cursor: pointer;
    }
    .map-card-add:active { opacity: .85; }

    /* Панель формы поверх карты (выезжает снизу/справа) */
    .form-panel {
      position: absolute;
      top: 0; right: 0; bottom: 0;
      z-index: 1100;
      width: 100%;
      max-width: 360px;
      background: #fff;
      box-shadow: -2px 0 12px rgba(0,0,0,.2);
      display: none;
      overflow-y: auto;
    }
    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; border-bottom: 1px solid #eee; font-size: 15px; font-weight: 500;
    }
    .panel-header .close { color: #999; cursor: pointer; font-size: 18px; }
    .panel-coords { padding: 8px 14px; font-size: 12px; color: #888; border-bottom: 1px solid #f2f2f2; }

    /* Секции-аккордеон */
    .section-title {
      padding: 12px 14px; border-top: 1px solid #f0a500; font-size: 14px;
      cursor: pointer; display: flex; justify-content: space-between; user-select: none;
    }
    .section-body { }
    .attr-form { padding: 6px 14px 14px; }
    .form-error { padding: 12px 14px; color: #c0392b; font-size: 13px; }

    /* Поля формы */
    .field { margin-bottom: 12px; }
    .field-label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
    .field-select, .field-input {
      width: 100%; height: 36px; padding: 0 10px; font-size: 14px;
      border: 1px solid #ccc; border-radius: 6px; background: #fff;
    }
    .field--checkbox { margin-bottom: 12px; }
    .checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
    .field-checkbox { width: 18px; height: 18px; }
    .field--disabled { opacity: .45; }
    .field--disabled .field-input, .field--disabled .field-select { background: #f5f5f5; cursor: not-allowed; }

    .panel-footer { padding: 6px 14px 16px; }
    .save-btn {
      width: 100%; height: 42px; background: #f0a500; color: #fff; border: none;
      border-radius: 6px; font-size: 15px; font-weight: 500; cursor: pointer;
    }
    .save-btn:active { opacity: .85; }
    .hint { font-size: 11px; color: #aaa; text-align: center; margin-top: 8px; }

    .debug {
      margin: 12px 14px 16px; padding: 10px; background: #f7f7f7; border-radius: 6px;
      font-size: 12px; font-family: monospace; white-space: pre-wrap; color: #333; display: none;
    }
  </style>
</head>
<body>
  <!-- Карта на весь экран -->
  <div id="map"></div>

  <!-- Панель формы ввода (поверх карты, скрыта до нажатия "Добавить") -->
  <div id="form-panel" class="form-panel">
    <div class="panel-header">
      <span>Вы хотите внести информацию о:</span>
      <span id="panel-close" class="close">✕</span>
    </div>
    <div id="panel-coords" class="panel-coords"></div>

    <!-- Сюда каркас отрисует три секции-аккордеона -->
    <div id="form-container"></div>

    <div class="panel-footer">
      <button id="save-btn" class="save-btn">Сохранить</button>
      <div class="hint">Отправка на сервер пока отключена (этап проекта)</div>
    </div>

    <pre id="debug" class="debug"></pre>
  </div>

  <script type="module" src="./app.ts"></script>
</body>
</html>
